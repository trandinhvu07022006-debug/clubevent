name: Clubevent CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test-mysql-redis:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: kmg_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies & security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-production.txt coverage ruff pip-audit
          pip check
      - name: Static syntax & lint checks
        run: |
          python -m compileall -q .
          ruff check --select E9,F63,F7,F82 .
      - name: Dependency vulnerability scan
        run: pip-audit
      - name: Django system & migration checks
        run: |
          python manage.py check --settings=config.settings_test
          python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Simulated production deploy check
        env:
          KMG_ENV_FILE: ""
          DEBUG: "False"
          DB_ENGINE: sqlite
          ALLOWED_HOSTS: clubevent.example.com
          USE_HTTPS: "True"
          ALLOW_DEMO_SEED: "False"
          SECRET_KEY: ci-deploy-check-secret-key-0123456789abcdef0123456789
          CERT_SIGNING_KEY: ci-deploy-check-cert-key-0123456789abcdef0123456789
          CHAT_MASTER_KEK: ci-deploy-check-chat-key-0123456789abcdef0123456789
        run: python manage.py check --deploy --settings=config.settings
      - name: Deployment unit tests (backup/restore & scheduler)
        run: |
          python -m unittest deployment/test_backup_restore.py deployment/test_scheduler.py -v
      - name: Run full test suite with coverage (MySQL 8.4 + Redis 7)
        env:
          KMG_TEST_DB_ENGINE: mysql
          KMG_TEST_DB_NAME: kmg_ci
          KMG_TEST_DB_TEST_NAME: test_kmg_ci
          KMG_TEST_DB_HOST: 127.0.0.1
          KMG_TEST_DB_PORT: "3306"
          KMG_TEST_DB_USER: root
          KMG_TEST_DB_PASSWORD: ""
          KMG_TEST_REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          coverage run --omit="*/migrations/*,*/test*.py" manage.py test --settings=config.settings_test
          coverage report --skip-covered
      - name: AI quality gate on isolated SQLite
        run: |
          python manage.py evaluate_ai --with-migrate --settings=config.settings_test

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full test suite (SQLite isolation)
        run: python manage.py test --settings=config.settings_test

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build -t kmg-app:ci .
      - name: Validate Compose config
        env:
          DB_PASSWORD: ci-temp-db-password
          MYSQL_ROOT_PASSWORD: ci-temp-root-password
        run: docker compose config -q
