name: Clubevent CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test-mysql-redis:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: kmg_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies & security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-production.txt coverage ruff pip-audit
          pip check
      - name: Static syntax & lint checks
        run: |
          python -m compileall -q .
          ruff check --select E9,F63,F7,F82 .
      - name: Dependency vulnerability scan
        run: pip-audit
      - name: Django system & migration checks
        run: |
          python manage.py check --settings=config.settings_test
          python manage.py makemigrations --check --dry-run --settings=config.settings_test
      - name: Simulated production deploy check
        env:
          KMG_ENV_FILE: ""
          KMG_ENV: prod
          DEBUG: "False"
          DB_ENGINE: mysql
          DB_NAME: kmg_prod
          DB_USER: kmg
          DB_PASSWORD: ci-deploy-db-password-placeholder
          ALLOWED_HOSTS: clubevent.example.com
          USE_HTTPS: "True"
          ALLOW_DEMO_SEED: "False"
          SECRET_KEY: ci-deploy-check-secret-key-0123456789abcdef0123456789
          CERT_SIGNING_KEY: ci-deploy-check-cert-key-0123456789abcdef0123456789
          CHAT_MASTER_KEK: ci-deploy-check-chat-key-0123456789abcdef0123456789
        run: python manage.py check --deploy --settings=config.settings
      - name: Deployment unit tests (backup/restore & scheduler)
        run: |
          python -m unittest deployment/test_backup_restore.py deployment/test_scheduler.py -v
      - name: Run full test suite with coverage (MySQL 8.4 + Redis 7)
        env:
          KMG_TEST_DB_ENGINE: mysql
          KMG_TEST_DB_NAME: kmg_ci
          KMG_TEST_DB_TEST_NAME: test_kmg_ci
          KMG_TEST_DB_HOST: 127.0.0.1
          KMG_TEST_DB_PORT: "3306"
          KMG_TEST_DB_USER: root
          KMG_TEST_DB_PASSWORD: ""
          KMG_TEST_REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          coverage run --omit="*/migrations/*,*/test*.py" manage.py test --settings=config.settings_test
          coverage report --skip-covered --fail-under=78
      - name: AI quality gate on isolated SQLite
        run: |
          python manage.py evaluate_ai --with-migrate --settings=config.settings_test

  test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run full test suite (SQLite isolation)
        run: python manage.py test --settings=config.settings_test

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated CI environment file (no production secrets)
        run: |
          python3 - <<'PY'
          import os
          import secrets
          from pathlib import Path

          env_path = Path(os.environ["RUNNER_TEMP"]) / "kmg-ci.env"
          db_pass = "ci_" + secrets.token_urlsafe(18)
          root_pass = "ci_root_" + secrets.token_urlsafe(18)
          values = {
              "ALLOW_DEMO_SEED": "False",
              "SECRET_KEY": "ci-compose-secret-" + secrets.token_urlsafe(32),
              "CERT_SIGNING_KEY": "ci-compose-cert-" + secrets.token_urlsafe(32),
              "CHAT_MASTER_KEK": "ci-compose-kek-" + secrets.token_urlsafe(32),
              "DB_NAME": "kmg_ci",
              "DB_USER": "kmg",
              "DB_PASSWORD": db_pass,
              "MYSQL_ROOT_PASSWORD": root_pass,
              "ALLOWED_HOSTS": "localhost,127.0.0.1",
              "HEALTHCHECK_HOST": "localhost",
              "SITE_URL": "http://127.0.0.1:8080",
              "CSRF_TRUSTED_ORIGINS": "http://127.0.0.1:8080,http://localhost:8080",
              "BIND_ADDRESS": "127.0.0.1",
              "HTTP_PORT": "8080",
              "PROXY_SCHEME": "http",
              "USE_HTTPS": "False",
              "SECURE_HSTS_SECONDS": "3600",
              "WEB_CONCURRENCY": "2",
              "SCHEDULER_INTERVAL_SECONDS": "300",
              "EMAIL_BACKEND": "django.core.mail.backends.console.EmailBackend",
              "SMS_PROVIDER": "console",
              "AI_PROVIDER": "mock",
              "AI_API_KEY": "",
          }
          env_path.write_text("\n".join(f"{k}={v}" for k, v in values.items()) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as gh:
              gh.write(f"KMG_ENV_FILE={env_path}\n")
              for k in ("DB_NAME", "DB_USER", "DB_PASSWORD", "MYSQL_ROOT_PASSWORD", "BIND_ADDRESS", "HTTP_PORT", "PROXY_SCHEME"):
                  gh.write(f"{k}={values[k]}\n")
          PY
      - name: Validate Compose config
        run: docker compose config -q
      - name: Build production image via Compose
        run: docker compose build
      - name: Start isolated Docker Compose stack
        run: docker compose up -d --wait --wait-timeout 240
      - name: Verify services, Nginx healthcheck, static files, login, and DB connectivity
        run: |
          set -euo pipefail
          docker compose ps -a
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq migrate)")" = "0"
          for i in $(seq 1 12); do
            if docker compose exec -T scheduler python deployment/scheduler_healthcheck.py; then
              break
            fi
            sleep 5
          done
          docker compose exec -T scheduler python deployment/scheduler_healthcheck.py
          docker compose exec -T -e MYSQL_PWD="$DB_PASSWORD" db mysqladmin ping -h 127.0.0.1 -u"$DB_USER"
          docker compose exec -T redis redis-cli ping | grep -q PONG
          docker compose exec -T web python deployment/healthcheck.py
          docker compose exec -T web python -c "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings'); django.setup(); from django.db import connection; c = connection.cursor(); c.execute('SELECT COUNT(*) FROM django_migrations'); assert c.fetchone()[0] > 0"
          python3 - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8080"
          with urllib.request.urlopen(f"{base}/health/", timeout=10) as resp:
              assert resp.status == 200
              assert json.load(resp) == {"ok": True}

          checked_assets = set()

          def verify_page(path, expected_status=200):
              req = urllib.request.Request(f"{base}{path}")
              with urllib.request.urlopen(req, timeout=10) as resp:
                  assert resp.status == expected_status, f"{path}: {resp.status}"
                  headers = {k.lower(): v for k, v in resp.headers.items()}
                  assert "content-security-policy" in headers, headers
                  assert headers.get("x-content-type-options", "").lower() == "nosniff", headers
                  assert headers.get("x-frame-options", "").upper() == "DENY", headers
                  html = resp.read().decode("utf-8")

              assets = re.findall(r'(?:href|src)="(/static/[^"?]+\.(?:css|js))(?:\?[^"]*)?"', html)
              assert assets, f"No static CSS/JS assets found on {path}"
              for asset in assets:
                  if asset in checked_assets:
                      continue
                  with urllib.request.urlopen(f"{base}{asset}", timeout=10) as aresp:
                      assert aresp.status == 200, f"Asset {asset} -> {aresp.status}"
                      assert len(aresp.read()) > 0, f"Empty asset {asset}"
                  checked_assets.add(asset)

          for public_path in ("/", "/portal/", "/taikhoan/dangnhap/", "/troly/"):
              verify_page(public_path)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)
          for auth_path in ("/tong-quan/", "/workspace/", "/congviec/viec-cua-toi/", "/ve/cua-toi/"):
              try:
                  opener.open(f"{base}{auth_path}", timeout=10)
              except urllib.error.HTTPError as exc:
                  assert exc.code in (302, 403), f"{auth_path} unexpected {exc.code}"
          print(f"Docker smoke verified {len(checked_assets)} static CSS/JS assets.")
          PY
      - name: Collect Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down CI Compose stack and volumes
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
          rm -f "${KMG_ENV_FILE:-}" || true

  playwright-ui-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          playwright install --with-deps chromium
      - name: Seed isolated staging database & run Playwright UI/responsive audit
        env:
          KMG_ENV_FILE: ""
          DEBUG: "True"
          KMG_ENV: dev
          DB_ENGINE: sqlite
          SECRET_KEY: "ci-playwright-staging-secret-key-not-for-prod-0123456789abcdef"
          CERT_SIGNING_KEY: "ci-playwright-staging-cert-key-0123456789abcdef0123456789"
          CHAT_MASTER_KEK: "ci-playwright-staging-kek-0123456789abcdef01234567890"
          AI_PROVIDER: mock
          EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
          SMS_PROVIDER: console
          ALLOW_DEMO_SEED: "True"
        run: |
          set -euo pipefail
          STAGING_DIR="${RUNNER_TEMP}/kmg-playwright-staging"
          mkdir -p "${STAGING_DIR}/media" "${STAGING_DIR}/private_vault" "${STAGING_DIR}/logs" "${STAGING_DIR}/report"
          export MEDIA_ROOT="${STAGING_DIR}/media"
          export PRIVATE_VAULT_ROOT="${STAGING_DIR}/private_vault"
          export LOG_ROOT="${STAGING_DIR}/logs"
          rm -f db.sqlite3
          python manage.py migrate --noinput
          python manage.py seed_kmg
          python manage.py seed_staging --scale smoke
          python manage.py seed_ai_knowledge
          python manage.py runserver 127.0.0.1:18080 --noreload > "${STAGING_DIR}/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" || true; rm -f db.sqlite3' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health/ >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health/
          python deployment/playwright_ui_audit.py --base-url http://127.0.0.1:18080 --out-dir "${STAGING_DIR}/report"
      - name: Upload Playwright screenshots & UI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-audit-report
          path: ${{ runner.temp }}/kmg-playwright-staging/report
          retention-days: 14
