{% load ui %}
{% comment %}
  Avatar dùng chung. Gọi bằng:
      {% include "partials/avatar.html" with person=user size="avatar-sm" %}
  Chưa upload ảnh thì hiện chữ cái đầu của tên trên nền tròn màu xanh.
{% endcomment %}
{% if person.avatar %}
  <img src="{{ person.avatar.url }}" class="avatar {{ size }}"
       alt="Ảnh đại diện {{ person.full_name|default:person.username }}">
{% else %}
  <span class="avatar-initials {{ size }}"
        title="{{ person.full_name|default:person.username }}"
        aria-hidden="true">{{ person|initials }}</span>
{% endif %}
